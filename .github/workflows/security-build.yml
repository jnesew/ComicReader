name: Security and unsigned build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          tools_zip="$RUNNER_TEMP/commandlinetools-linux-13114758_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$tools_zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$tools_zip" | \
            sha256sum --check --strict
          unzip -q "$tools_zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$license_status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;35.0.1'

      - name: Check source, wrapper, secrets, and tracked artifacts
        run: scripts/verify-source-security.sh

      - name: Test and build unsigned release
        run: ./gradlew --no-daemon --dependency-verification strict testDebugUnitTest lintRelease assembleRelease

      - name: Verify Unicode database round-trip
        run: scripts/verify-database-roundtrip.sh

      - name: Confirm empty runtime dependency graph
        shell: bash
        run: |
          ./gradlew --no-daemon --dependency-verification strict -q \
            :app:dependencies --configuration releaseRuntimeClasspath > build/runtime-dependencies.txt
          grep -q 'No dependencies' build/runtime-dependencies.txt

      - name: Inspect unsigned APK
        shell: bash
        run: |
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$apk"
          permissions="$($ANDROID_HOME/build-tools/35.0.1/aapt2 dump permissions "$apk")"
          if grep -q '^uses-permission:' <<<"$permissions"; then
            printf '%s\n' "$permissions" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "$apk"
          unzip -tq "$apk"
          if "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify "$apk" \
              > build/unsigned-signature.txt 2>&1; then
            echo 'Source-verification APK must remain unsigned.' >&2
            exit 1
          fi
          grep -q 'Missing META-INF/MANIFEST.MF' build/unsigned-signature.txt

      - name: Verify isolated reproducible builds
        run: scripts/verify-reproducible-build.sh
