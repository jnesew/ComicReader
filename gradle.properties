org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dcom.google.protobuf.error_on_unsafe_pre22_gencode=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# Single source of truth for Android manifests, APK names, and GitHub release tags.
comicViewerVersionCode=7
comicViewerVersionName=1.4.0

# Public distribution identity. Java/resource namespace can stay unchanged in a fork.
comicViewerApplicationId=io.github.jnesew.comicviewer
comicViewerArtifactPrefix=ComicViewer-Android
comicViewerReleaseName=ComicViewer
comicViewerReleaseBranch=main
comicViewerRetiredApplicationIds=com.localtools.comicviewer

# Independent, side-by-side diagnostic application; bump before distributing changed bench APKs.
comicViewerBenchVersionCode=6
comicViewerBenchVersionName=1.4.0

# Side-by-side standard-reader debug APK; increment before distributing changed APKs.
comicViewerReaderTestVersionCode=4
