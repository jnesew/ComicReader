plugins {
    id 'com.android.application'
}

def comicViewerVersionCode = providers.gradleProperty('comicViewerVersionCode').get().toInteger()
def comicViewerVersionName = providers.gradleProperty('comicViewerVersionName').get()

def unsignedRelease = providers.gradleProperty('comicViewerUnsignedRelease').orElse('false').get().toBoolean()
def signingProperties = new Properties()
def configuredSigningProperties = System.getenv('COMICVIEWER_SIGNING_PROPERTIES')
def signingPropertiesFile = configuredSigningProperties
        ? rootProject.file(configuredSigningProperties)
        : rootProject.file('signing/keystore.properties')
if (!unsignedRelease && configuredSigningProperties && !signingPropertiesFile.exists()) {
    throw new GradleException(
            "COMICVIEWER_SIGNING_PROPERTIES does not exist: ${signingPropertiesFile}")
}
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    environmentValue != null ? environmentValue : signingProperties.getProperty(propertyName, '')
}
def signingStoreFile = signingValue('COMICVIEWER_KEYSTORE_PATH', 'storeFile')
def signingStorePassword = signingValue('COMICVIEWER_STORE_PASSWORD', 'storePassword')
def signingKeyAlias = signingValue('COMICVIEWER_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = signingValue('COMICVIEWER_KEY_PASSWORD', 'keyPassword')
def signingValues = [
        signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword
]
def signingRequested = signingPropertiesFile.exists() || signingValues.any { !it.isEmpty() }
def releaseSigningConfigured = signingValues.every { !it.isEmpty() }
if (!unsignedRelease && signingRequested && !releaseSigningConfigured) {
    throw new GradleException('Release signing is only partially configured. ' +
            'Provide storeFile, storePassword, keyAlias, and keyPassword together.')
}

android {
    namespace = 'io.github.jnesew.comicviewer'
    compileSdk = 36
    buildToolsVersion = '35.0.1'

    defaultConfig {
        applicationId = providers.gradleProperty('comicViewerApplicationId').orElse('io.github.jnesew.comicviewer').get()
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = "io.github.jnesew.comicviewer.data.DatabaseTestRunner"
        versionCode = comicViewerVersionCode
        versionName = comicViewerVersionName
        manifestPlaceholders = [comicViewerFixtureAuthority: "${applicationId}.test.documents"]
    }

    signingConfigs {
        if (!unsignedRelease && releaseSigningConfigured) {
            localRelease {
                storeFile = rootProject.file(signingStoreFile)
                setStorePassword(signingStorePassword)
                keyAlias = signingKeyAlias
                setKeyPassword(signingKeyPassword)
            }
        }
    }

    buildTypes {
        debug {
            pseudoLocalesEnabled = true
        }
        readerDebug {
            initWith debug
            applicationIdSuffix '.readertest'
            signingConfig = signingConfigs.debug
            debuggable = true
            matchingFallbacks = ['debug']
        }
        release {
            if (!unsignedRelease && releaseSigningConfigured) {
                signingConfig = signingConfigs.localRelease
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        renderBench {
            initWith release
            applicationIdSuffix '.renderbench'
            versionNameSuffix ''
            signingConfig = signingConfigs.debug
            debuggable = false
            matchingFallbacks = ['release']
            def source = providers.gradleProperty('renderBenchSource').orElse('unknown').get()
            if (!(source ==~ /(?:[0-9a-f]{7,40}(?:-dirty)?|unknown)/)) {
                throw new GradleException('renderBenchSource must be a Git revision with an optional -dirty suffix')
            }
            buildConfigField 'String', 'BENCH_SOURCE', '"' + source + '"'
        }
    }

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector().withBuildType('readerDebug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(providers.gradleProperty('comicViewerReaderTestVersionCode').map { it.toInteger() })
        }
    }
    onVariants(selector().withBuildType('renderBench')) { variant ->
        variant.outputs.each { output ->
            output.versionName.set(providers.gradleProperty('comicViewerBenchVersionName'))
            output.versionCode.set(providers.gradleProperty('comicViewerBenchVersionCode').map { it.toInteger() })
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
