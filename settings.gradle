                        'org.eclipse.ee4j',
                        'org.glassfish.jaxb',
                        'org.hamcrest',
                        'org.jdom',
                        'org.jetbrains',
                        'org.jetbrains.kotlin',
                        'org.jetbrains.kotlinx',
                        'org.junit',
                        'org.jvnet.staxex',
                        'org.ow2',
                        'org.ow2.asm',
                        'org.slf4j',
                        'org.sonatype.oss',
                        'org.tensorflow'
                ].each { groupName -> includeGroup groupName }
            }
        }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application') {
                useModule("com.android.tools.build:gradle:${requested.version}")
            }
        }
    }
}

